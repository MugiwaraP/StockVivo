<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StockVivo — Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap"
    rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --lime: #C8F135;
      --coral: #FF5E5B;
      --ocean: #0D47FF;
      --violet: #7B2FFF;
      --dark: #0E0E12;
      --card: #17171E;
      --text: #F0F0F0;
      --muted: #888;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--dark);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Animated background blobs */
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: var(--dark);
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.35;
      animation: float 8s ease-in-out infinite;
    }

    .blob1 {
      width: 420px;
      height: 420px;
      background: var(--violet);
      top: -100px;
      left: -100px;
      animation-delay: 0s;
    }

    .blob2 {
      width: 300px;
      height: 300px;
      background: var(--ocean);
      bottom: -80px;
      right: -60px;
      animation-delay: 2s;
    }

    .blob3 {
      width: 200px;
      height: 200px;
      background: var(--coral);
      top: 40%;
      left: 55%;
      animation-delay: 4s;
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0) scale(1);
      }

      50% {
        transform: translateY(-30px) scale(1.05);
      }
    }

    .wrapper {
      position: relative;
      z-index: 1;
      display: flex;
      gap: 0;
      width: min(900px, 95vw);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
      animation: slideUp .6s cubic-bezier(.22, 1, .36, 1) both;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(40px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* LEFT PANEL */
    .panel-left {
      flex: 1;
      background: linear-gradient(135deg, var(--violet), var(--ocean));
      padding: 48px 40px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .logo {
      font-family: 'Syne', sans-serif;
      font-size: 28px;
      font-weight: 800;
      color: #fff;
      letter-spacing: -1px;
    }

    .logo span {
      color: var(--lime);
    }

    .panel-tagline {
      font-family: 'Syne', sans-serif;
      font-size: 42px;
      font-weight: 800;
      line-height: 1.1;
      color: #fff;
    }

    .panel-tagline em {
      color: var(--lime);
      font-style: normal;
    }

    .panel-features {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .feature {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.8);
    }

    .feature-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--lime);
      flex-shrink: 0;
    }

    /* RIGHT PANEL */
    .panel-right {
      width: 400px;
      background: var(--card);
      padding: 48px 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 24px;
    }

    .form-title {
      font-family: 'Syne', sans-serif;
      font-size: 26px;
      font-weight: 800;
      color: var(--text);
    }

    .form-title span {
      color: var(--lime);
    }

    .tabs {
      display: flex;
      background: #1E1E28;
      border-radius: 10px;
      padding: 4px;
    }

    .tab {
      flex: 1;
      text-align: center;
      padding: 8px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      color: var(--muted);
      transition: all .2s;
    }

    .tab.active {
      background: var(--lime);
      color: var(--dark);
      font-weight: 700;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field label {
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .5px;
    }

    .field input {
      background: #1E1E28;
      border: 1.5px solid #2E2E3A;
      border-radius: 10px;
      padding: 12px 14px;
      color: var(--text);
      font-size: 15px;
      font-family: 'DM Sans', sans-serif;
      outline: none;
      transition: border-color .2s;
    }

    .field input:focus {
      border-color: var(--lime);
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: var(--lime);
      color: var(--dark);
      font-family: 'Syne', sans-serif;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      transition: transform .15s, box-shadow .15s;
      letter-spacing: -.3px;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(200, 241, 53, 0.3);
    }

    .btn:active {
      transform: translateY(0);
    }

    .msg {
      font-size: 13px;
      text-align: center;
      min-height: 18px;
    }

    .msg.error {
      color: var(--coral);
    }

    .msg.success {
      color: var(--lime);
    }

    .form-section {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 680px) {
      .panel-left {
        display: none;
      }

      .panel-right {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <div class="bg">
    <div class="blob blob1"></div>
    <div class="blob blob2"></div>
    <div class="blob blob3"></div>
  </div>

  <div class="wrapper">
    <!-- LEFT -->
    <div class="panel-left">
      <div class="logo">Stock<span>Vivo</span></div>
      <div class="panel-tagline">Tu tienda,<br>bajo <em>control</em><br>total.</div>
      <div class="panel-features">
        <div class="feature">
          <div class="feature-dot"></div>Inventario en tiempo real
        </div>
        <div class="feature">
          <div class="feature-dot"></div>Alertas automáticas de stock
        </div>
        <div class="feature">
          <div class="feature-dot"></div>Reportes de movimientos
        </div>
        <div class="feature">
          <div class="feature-dot"></div>Multi-usuario con roles
        </div>
      </div>
    </div>

    <!-- RIGHT -->
    <div class="panel-right">
      <div class="form-title">Bienvenido a <span>StockVivo</span></div>

      <div class="tabs">
        <div class="tab active" onclick="switchTab('login')">Iniciar sesión</div>
        <div class="tab" onclick="switchTab('registro')">Registrarse</div>
      </div>


      <!-- LOGIN -->
      <div id="form-login" class="form-section">
        <div class="field">
          <label>Correo</label>
          <input type="email" id="login-email" placeholder="tu@correo.com" />
        </div>

        <div class="field">
          <label>Contraseña</label>
          <input type="password" id="login-password" placeholder="••••••••" />
        </div>

        <button class="btn" onclick="login()">Entrar →</button>

        <div class="msg" id="login-msg"></div>

        <!-- Separador -->
        <div style="text-align:center; margin:4px 0; color:var(--muted); font-size:13px;">
          — o —
        </div>

        <!-- Botón Google -->
        <a href="/auth/google" style="
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      width:100%;
      box-sizing:border-box;
      padding:12px;
      background:#ffffff;
      border:1px solid #dcdcdc;
      border-radius:10px;
      color:#333;
      text-decoration:none;
      font-weight:600;
      font-size:14px;
      cursor:pointer;
      transition: all .2s;
    " onmouseover="this.style.transform='translateY(-2px)'" onmouseout="this.style.transform='translateY(0)'">
          <img src="https://www.google.com/favicon.ico" alt="Google" width="18" height="18" />
          Continuar con Google
        </a>
      </div>

      <!-- REGISTRO -->
      <div id="form-registro" class="form-section hidden">
        <div class="field">
          <label>Nombre</label>
          <input type="text" id="reg-nombre" placeholder="Tu nombre" />
        </div>

        <div class="field">
          <label>Correo</label>
          <input type="email" id="reg-email" placeholder="tu@correo.com" />
        </div>

        <div class="field">
          <label>Contraseña</label>
          <input type="password" id="reg-password" placeholder="••••••••" />
        </div>

        <button class="btn" onclick="registro()">Crear cuenta →</button>

        <div class="msg" id="reg-msg"></div>
      </div>

      <script>
        const API = 'http://localhost:5000';

        function switchTab(tab) {
          document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', (i === 0 && tab === 'login') || (i === 1 && tab === 'registro')));
          document.getElementById('form-login').classList.toggle('hidden', tab !== 'login');
          document.getElementById('form-registro').classList.toggle('hidden', tab !== 'registro');
        }

        async function login() {
          const email = document.getElementById('login-email').value;
          const password = document.getElementById('login-password').value;
          const msg = document.getElementById('login-msg');
          try {
            const res = await fetch(`${API}/api/login`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password }) });
            const data = await res.json();
            if (!res.ok) { msg.className = 'msg error'; msg.textContent = data.error || 'Error al iniciar sesión'; return; }
            localStorage.setItem('token', data.token);
            localStorage.setItem('usuario', JSON.stringify(data.usuario));
            msg.className = 'msg success'; msg.textContent = '✓ Entrando...';
            setTimeout(() => window.location.href = '/dashboard', 800);
          } catch (e) { msg.className = 'msg error'; msg.textContent = 'No se pudo conectar al servidor'; }
        }

        async function registro() {
          const nombre = document.getElementById('reg-nombre').value;
          const email = document.getElementById('reg-email').value;
          const password = document.getElementById('reg-password').value;
          const msg = document.getElementById('reg-msg');
          try {
            const res = await fetch(`${API}/api/registro`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ nombre, email, password }) });
            const data = await res.json();
            if (!res.ok) { msg.className = 'msg error'; msg.textContent = data.error || 'Error al registrarse'; return; }
            msg.className = 'msg success'; msg.textContent = '✓ Cuenta creada. Inicia sesión.';
            setTimeout(() => switchTab('login'), 1200);
          } catch (e) { msg.className = 'msg error'; msg.textContent = 'No se pudo conectar al servidor'; }
        }

        // Capturar token de Google OAuth
        const params = new URLSearchParams(window.location.search);
        if (params.get('token')) {
          localStorage.setItem('token', params.get('token'));
          localStorage.setItem('usuario', JSON.stringify({
            id: params.get('id'),
            nombre: params.get('nombre'),
            rol: params.get('rol'),
            email: ''
          }));
          window.location.href = '/dashboard';
        }
      </script>
</body>

</html>
